name: Validate library

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/qa.txt
      - name: Install CLI and development tools
        run: |
          python -m pip install -r requirements/qa.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check formatting
        run: python -m ruff format --check src tests scripts
      - name: Validate skill metadata and registry
        run: trust-skills validate --root .
      - name: Test all skill workflows
        run: python -m pytest -q
      - name: Structural registry checks (no live URL requests)
        run: trust-skills registry --registry standards/registry.yaml
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
      - name: Prepare pinned offline install dependencies
        run: |
          python -m pip download --only-binary=:all: --dest tmp/qa-wheelhouse -r requirements/smoke.txt
      - name: Clean sdist and wheel installation smoke tests
        run: python scripts/install_smoke.py --wheelhouse tmp/qa-wheelhouse
